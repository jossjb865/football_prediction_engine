name: Autocorrección de Código con NVIDIA (Archivo por Archivo)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  nvidia-autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librería OpenAI
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Analizar y Corregir Archivos Individualmente
        env:
          NVIDIA_API_KEY: \${{ secrets.NVIDIA_API_KEY }}
        shell: python
        run: |
          import os
          import glob
          import re
          from openai import OpenAI

          # 1. Validar la clave de API
          api_key = os.getenv("NVIDIA_API_KEY")
          if not api_key:
              print("::error::Falta configurar NVIDIA_API_KEY en los Secretos de GitHub.")
              exit(1)

          # 2. Inicializar cliente con un modelo de alta capacidad de codificación
          client = OpenAI(
              base_url="https://nvidia.com",
              api_key=api_key
          )
          
          # Buscamos todos los archivos .py válidos en tu proyecto predictivo
          archivos = [f for f in glob.glob("**/*.py", recursive=True) if not any(excluido in f for excluido in ["venv", ".venv", "env", "node_modules", ".git"])]

          if not archivos:
              print("No se encontraron scripts de Python para procesar.")
              exit(0)

          cambios_totales = 0

          # 3. Iterar y refactorizar archivo por archivo para proteger los límites del servidor
          for ruta in archivos:
              print(f"\n[Procesando] Analizando inconsistencias en: {ruta}...")
              try:
                  with open(ruta, "r", encoding="utf-8") as f:
                      codigo_actual = f.read()

                  # Omitir archivos prácticamente vacíos
                  if len(codigo_actual.strip()) < 10:
                      continue

                  prompt_sistema = (
                      "Eres un refactorizador de código automatizado especializado en Python y Machine Learning. "
                      "Tu única tarea es recibir un script, corregir sus inconsistencias lógicas, bugs de sintaxis u optimizaciones de datos, "
                      "y devolver el código completo corregido envuelto exclusivamente dentro de un bloque de código markdown de Python.\n\n"
                      "Formato obligatorio de respuesta:\n"
                      "```python\n"
                      "# Tu código corregido aquí\n"
                      "```\n"
                      "No agregues explicaciones adicionales, introducciones ni saludos antes o después del bloque."
                  )

                  prompt_usuario = f"Optimiza y corrige el código del archivo deportivo localizado en la ruta '{ruta}':\n\n{codigo_actual}"

                  completion = client.chat.completions.create(
                      model="meta/llama-3.3-70b-instruct",
                      messages=[
                          {"role": "system", "content": prompt_sistema},
                          {"role": "user", "content": prompt_usuario}
                      ],
                      temperature=0.1,
                      max_tokens=4096
                  )

                  respuesta = completion.choices[0].message.content.strip()

                  # 4. Extraer el bloque de código limpio usando expresiones regulares
                  match = re.search(r"```python\s*(.*?)\s*```", respuesta, re.DOTALL)
                  if match:
                      nuevo_codigo = match.group(1).strip()
                  else:
                      # Si no usó marcas markdown, evaluar si devolvió código directo
                      if respuesta.startswith("import") or respuesta.startswith("from") or "def " in respuesta:
                          nuevo_codigo = respuesta
                      else:
                          print(f"⚠ La API no devolvió un formato procesable para {ruta}. Se omite.")
                          continue

                  # 5. Sobreescribir si se hallaron mejoras significativas
                  if codigo_actual.strip() != nuevo_codigo:
                      with open(ruta, "w", encoding="utf-8") as f:
                          f.write(nuevo_codigo + "\n")
                      print(f"✓ ¡Correcciones aplicadas con éxito en {ruta}!")
                      cambios_totales += 1
                  else:
                      print(f" No se requirieron cambios estructurales para {ruta}.")

              except Exception as e:
                  print(f"::warning::Error al procesar el archivo {ruta}: {e}. Continuando con el siguiente...")

          print(f"\nProceso concluido. Archivos modificados en total: {cambios_totales}")

      # 6. Guardar cambios de forma segura en tu repositorio
      - name: Confirmar y subir cambios corregidos por la IA
        run: |
          git config --global user.name "NVIDIA AI Auto-Fixer"
          git config --global user.email "actions@github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "style(nvidia-ai): corrección automatizada e independiente de archivos .py"
            git push origin HEAD:${{ github.ref }}
            echo "Cambios reflejados y subidos exitosamente a GitHub."
          else
            echo "El motor predictivo se encuentra completamente optimizado. No hay cambios pendientes."
          fi
