name: Autocorrección Estricta de Código con NVIDIA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  nvidia-autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librería OpenAI
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Analizar y Aplicar Correcciones Automáticas
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: python
        run: |
          import os
          import glob
          import json
          from openai import OpenAI

          # 1. Validar la clave de API
          api_key = os.getenv("NVIDIA_API_KEY")
          if not api_key:
              print("::error::Falta configurar NVIDIA_API_KEY en los Secretos de GitHub.")
              exit(1)

          # 2. Recopilar código de football_prediction_engine
          print("Escaneando archivos del motor de predicciones de fútbol...")
          archivos_codigo = {}
          for archivo in glob.glob("**/*.py", recursive=True):
              if any(excluido in archivo for excluido in ["venv", ".venv", "env", "node_modules", ".git"]):
                  continue
              try:
                  with open(archivo, "r", encoding="utf-8") as f:
                      archivos_codigo[archivo] = f.read()
              except Exception as e:
                  print(f"No se pudo leer {archivo}: {e}")

          if not archivos_codigo:
              print("No se encontraron scripts de Python para corregir.")
              exit(0)

          # 3. Prompt estricto para asegurar la generación de JSON válido
          prompt_sistema = (
              "Eres un sistema automatizado de refactorización de software. Tu única función es corregir "
              "inconsistencias lógicas, bugs sintácticos y optimizaciones de Machine Learning (Data Leakage, Pandas, Scikit-Learn) "
              "en los archivos proporcionados.\n\n"
              "DEBES RESPONDER EXCLUSIVAMENTE EN FORMATO JSON. No incluyas texto de saludo, ni marcas de bloques de código como ```json, ni explicaciones.\n"
              "El formato esperado del JSON debe ser estrictamente un diccionario donde las llaves son las rutas de los archivos y los valores son el CÓDIGO COMPLETO CORREGIDO:\n"
              "{\n"
              '  "ruta/del/archivo1.py": "codigo completo corregido aqui...",\n'
              '  "ruta/del/archivo2.py": "codigo completo corregido aqui..."\n'
              "}"
          )

          contexto_archivos = json.dumps(archivos_codigo, ensure_ascii=False, indent=2)
          prompt_usuario = f"Corrige las inconsistencias de los siguientes archivos del repositorio:\n\n{contexto_archivos}"

          client = OpenAI(
              base_url="https://nvidia.com",
              api_key=api_key
          )

          print("Conectando con la API de NVIDIA para generar soluciones estructuradas...")
          try:
              # Usamos un modelo altamente optimizado para seguimiento de instrucciones y formateo estructurado JSON
              completion = client.chat.completions.create(
                  model="meta/llama-3.3-70b-instruct",
                  messages=[
                      {"role": "system", "content": prompt_sistema},
                      {"role": "user", "content": prompt_usuario}
                  ],
                  temperature=0.1,
                  max_tokens=16384
              )

              respuesta_raw = completion.choices[0].message.content.strip()
              
              # Limpieza preventiva si el modelo encapsula la respuesta en bloques de código markdown
              if respuesta_raw.startswith("```"):
                  lineas = respuesta_raw.splitlines()
                  if lineas[0].startswith("```"):
                      lineas = lineas[1:]
                  if lineas[-1].startswith("```"):
                      lineas = lineas[:-1]
                  respuesta_raw = "\n".join(lineas).strip()

              # 4. Parsear JSON y sobreescribir los archivos modificados
              correcciones = json.loads(respuesta_raw)
              
              cambios_realizados = 0
              for ruta, nuevo_codigo in correcciones.items():
                  if os.path.exists(ruta):
                      with open(ruta, "r", encoding="utf-8") as f:
                          codigo_actual = f.read()
                      
                      if codigo_actual.strip() != nuevo_codigo.strip():
                          with open(ruta, "w", encoding="utf-8") as f:
                              f.write(nuevo_codigo)
                          print(f"✓ Archivo corregido y actualizado con éxito: {ruta}")
                          cambios_realizados += 1
                  else:
                      print(f"Advertencia: El modelo sugirió cambios para una ruta inexistente: {ruta}")

              if cambios_realizados == 0:
                  print("NVIDIA determinó que tu código no presenta inconsistencias. No se requirieron cambios.")
                  
          except json.JSONDecodeError:
              print("::error::La IA no devolvió un JSON válido. Revisa los logs de la respuesta cruda:")
              print(respuesta_raw)
              exit(1)
          except Exception as e:
              # Manejo detallado si la API responde con un objeto de error o HTML
              print(f"::error::Error detectado durante la consulta o procesamiento de la API de NVIDIA: {e}")
              if 'completion' in locals() and hasattr(completion, 'text'):
                  print(f"Contenido crudo del error: {completion.text}")
              exit(1)

      # 5. Git Commit y Push
      - name: Confirmar y subir cambios corregidos por la IA
        run: |
          git config --global user.name "NVIDIA AI Auto-Fixer"
          git config --global user.email "actions@github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "style(nvidia-ai): corrección automática de inconsistencias lógicas"
            git push origin HEAD:${{ github.ref }}
            echo "Cambios subidos exitosamente al repositorio."
          else
            echo "No se detectaron diferencias estructurales en los archivos."
          fi
