name: Autocorrección Estricta de Código con NVIDIA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  nvidia-autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install openai pydantic

      - name: Analizar y Aplicar Correcciones Automáticas
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: python
        run: |
          import os
          import glob
          import json
          from openai import OpenAI
          from pydantic import BaseModel, Field
          from typing import List, Dict

          # 1. Validar la clave de API
          api_key = os.getenv("NVIDIA_API_KEY")
          if not api_key:
              print("::error::Falta configurar NVIDIA_API_KEY en los Secretos de GitHub.")
              exit(1)

          # 2. Recopilar archivos relevantes (limitando tamaño para evitar bloqueos HTML)
          print("Escaneando archivos del motor de predicciones de fútbol...")
          archivos_codigo = {}
          for archivo in glob.glob("**/*.py", recursive=True):
              if any(excluido in archivo for excluido in ["venv", ".venv", "env", "node_modules", ".git"]):
                  continue
              try:
                  with open(archivo, "r", encoding="utf-8") as f:
                      contenido = f.read()
                      # Evitar enviar archivos vacíos o masivos que saturen la API
                      if 10 < len(contenido) < 50000:
                          archivos_codigo[archivo] = contenido
              except Exception as e:
                  print(f"No se pudo leer {archivo}: {e}")

          if not archivos_codigo:
              print("No se encontraron scripts de Python válidos para corregir.")
              exit(0)

          # 3. Definir el esquema JSON estricto mediante Pydantic
          class CorreccionArchivo(BaseModel):
              ruta_archivo: str = Field(description="La ruta exacta del archivo a corregir")
              codigo_corregido: str = Field(description="El contenido completo del código de Python corregido y optimizado")

          class EsquemaRefactorizacion(BaseModel):
              archivos_modificados: List[CorreccionArchivo]

          # 4. Configurar cliente e invocar la API con Formato de Respuesta Estricto
          client = OpenAI(
              base_url="https://nvidia.com",
              api_key=api_key
          )

          prompt_usuario = (
              "Analiza y optimiza los siguientes archivos de mi motor de predicción de fútbol en Python. "
              "Corrige errores lógicos, problemas de consistencia de datos deportivos o bugs sintácticos.\n\n"
              f"{json.dumps(archivos_codigo, ensure_ascii=False)}"
          )

          print("Conectando con la API de NVIDIA mediante formato estructurado...")
          try:
              # Usamos Llama-3.1-70b que tiene un soporte óptimo para JSON estructurado nativo
              completion = client.beta.chat.completions.parse(
                  model="meta/llama-3.1-70b-instruct",
                  messages=[
                      {
                          "role": "system", 
                          "content": "Eres un refactorizador de código automatizado. Reescribe el código de los archivos entregados corrigiendo inconsistencias."
                      },
                      {"role": "user", "content": prompt_usuario}
                  ],
                  response_format=EsquemaRefactorizacion,
                  temperature=0.1
              )

              # 5. Aplicar los cambios parseados directamente
              respuesta_estructurada = completion.choices[0].message.parsed
              cambios_realizados = 0

              for item in respuesta_estructurada.archivos_modificados:
                  ruta = item.ruta_archivo
                  nuevo_codigo = item.codigo_corregido

                  if os.path.exists(ruta):
                      with open(ruta, "r", encoding="utf-8") as f:
                          codigo_actual = f.read()
                      
                      if codigo_actual.strip() != nuevo_codigo.strip():
                          with open(ruta, "w", encoding="utf-8") as f:
                              f.write(nuevo_codigo)
                          print(f"✓ Archivo corregido y actualizado: {ruta}")
                          cambios_realizados += 1
                  else:
                      print(f"Ignorando sugerencia para ruta no existente: {ruta}")

              if cambios_realizados == 0:
                  print("No se requirieron cambios en el repositorio.")

          except Exception as e:
              print(f"::error::Error crítico procesando la API de NVIDIA: {e}")
              exit(1)

      # 6. Git Commit y Push seguro
      - name: Confirmar y subir cambios corregidos por la IA
        run: |
          git config --global user.name "NVIDIA AI Auto-Fixer"
          git config --global user.email "actions@github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "style(nvidia-ai): corrección automática de inconsistencias lógicas"
            git push origin HEAD:${{ github.ref }}
            echo "Cambios subidos exitosamente al repositorio."
          else
            echo "No se detectaron diferencias estructurales en los archivos."
          fi
