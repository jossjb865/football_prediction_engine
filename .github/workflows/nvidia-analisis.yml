name: Análisis Avanzado con NVIDIA Nemotron 3 Ultra

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  nvidia-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librería OpenAI
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Ejecutar análisis de consistencia con OpenAI Client
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: python
        run: |
          import os
          import glob
          from openai import OpenAI

          # 1. Validar la clave de API
          api_key = os.getenv("NVIDIA_API_KEY")
          if not api_key:
              print("::error::Falta configurar NVIDIA_API_KEY en los Secretos de GitHub.")
              exit(1)

          # 2. Recopilar todos tus archivos de predicción futbolística (.py)
          print("Recopilando archivos Python del repositorio football_prediction_engine...")
          archivos_codigo = {}
          
          for archivo in glob.glob("**/*.py", recursive=True):
              if any(excluido in archivo for excluido in ["venv", ".venv", "env", "node_modules", ".git"]):
                  continue
              try:
                  with open(archivo, "r", encoding="utf-8") as f:
                      archivos_codigo[archivo] = f.read()
              except Exception as e:
                  print(f"Advertencia: No se pudo leer {archivo}: {e}")

          if not archivos_codigo:
              print("::warning::No se encontraron scripts de Python para analizar.")
              exit(0)

          # 3. Estructurar el contexto de código para la IA
          contexto_codigo = ""
          for ruta, contenido in archivos_codigo.items():
              contexto_codigo += f"\n--- ARCHIVO: {ruta} ---\n{contenido}\n"

          prompt_usuario = (
              "Analiza en detalle las inconsistencias de este motor de predicción de fútbol en Python. "
              "Revisa problemas lógicos en el preprocesamiento de datos (Pandas/Numpy), fugas de datos "
              "entre sets de entrenamiento y prueba (data leakage), y errores en las predicciones. "
              f"Aquí está el código:\n\n{contexto_codigo}"
          )

          # 4. Inicializar cliente con la URL Base de NVIDIA
          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=api_key
          )

          # 5. Generar Completado por Streaming (capturando razonamiento interno y contenido)
          print("Iniciando análisis avanzado y conectando con NVIDIA API...")
          try:
              completion = client.chat.completions.create(
                  model="nvidia/nemotron-3-ultra-550b-a55b",
                  messages=[
                      {
                          "role": "system", 
                          "content": "Eres un arquitecto de software experto en Machine Learning aplicado al deporte. Analiza el código buscando inconsistencias y bugs."
                      },
                      {"role": "user", "content": prompt_usuario}
                  ],
                  temperature=0.2, # Ajustado a un valor bajo para que el análisis técnico sea preciso y consistente
                  top_p=0.95,
                  max_tokens=16384,
                  extra_body={
                      "chat_template_kwargs": {"enable_thinking": True},
                      "reasoning_budget": 16384
                  },
                  stream=True
              )

              print("\n" + "="*60)
              print(" [PROCESO DE RAZONAMIENTO E INFORME FINAL DE NVIDIA] ")
              print("="*60 + "\n")

              # 6. Iterar el stream imprimiendo reasoning_content y content
              for chunk in completion:
                  if not chunk.choices:
                      continue
                  
                  # Captura la cadena de pensamiento profundo si el modelo la genera
                  reasoning = getattr(chunk.choices[0].delta, "reasoning_content", None)
                  if reasoning:
                      print(reasoning, end="")
                      
                  # Captura el informe de errores e inconsistencias final
                  if chunk.choices[0].delta.content is not None:
                      print(chunk.choices[0].delta.content, end="")
                      
              print("\n\n" + "="*60)

          except Exception as e:
              print(f"\n::error::Error crítico durante el streaming de la API: {e}")
              exit(1)
