name: Daily Prediction Batch

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Prediction date (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""
      competitions:
        description: "Space-separated competition IDs"
        required: true
        default: "sr:competition:17"

  schedule:
    # Ejecución diaria a las 06:00 UTC
    - cron: "0 6 * * *"

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
      SPORTRADAR_ACCESS_LEVEL: ${{ secrets.SPORTRADAR_ACCESS_LEVEL || 'trial' }}
      ARTIFACTS_DIR: ./artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create artifacts directory
        run: mkdir -p artifacts/models

      # Descarga cruzada nativa buscando el artefacto del flujo de entrenamiento usando la CLI de GitHub integrada
      - name: Download latest trained models via gh CLI
        id: download_models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Buscando la última ejecución exitosa del flujo 'Train Super-Ensemble'..."
          RUN_ID=$(gh run list --workflow="Train Super-Ensemble" --status=success --limit 1 --json databaseId --jq '.[0].databaseId' || echo "")
          
          if [ -n "$RUN_ID" ]; then
            echo "✅ Ejecución de entrenamiento encontrada: $RUN_ID"
            echo "Descargando artefacto 'trained-models'..."
            gh run download $RUN_ID --name trained-models --dir artifacts/models/ || echo "⚠️ Falló la descarga por gh CLI"
          else
            echo "❌ No se encontró ninguna ejecución previa exitosa del flujo de entrenamiento."
          fi

      # Verificación del estado de los archivos del modelo antes de ejecutar la predicción
      - name: Verify models structure
        id: check_models
        run: |
          if [ -d "artifacts/models" ] && [ "$(ls -A artifacts/models 2>/dev/null)" ]; then
            echo "✅ Modelos listos para la inferencia estadística."
            echo "has_models=true" >> $GITHUB_OUTPUT
            ls -la artifacts/models/
          else
            echo "❌ CRÍTICO: No hay modelos cargados. El script predict.py podría fallar."
            echo "has_models=false" >> $GITHUB_OUTPUT
          fi

      - name: Run inference
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          COMPETITIONS="${{ github.event.inputs.competitions || 'sr:competition:17' }}"

          echo "Running prediction with competitions: $COMPETITIONS"
          python predict.py $DATE_ARG --competitions $COMPETITIONS --log-level INFO

      # Subida segura de resultados: Se cambia a 'warn' para rastrear fallos del script sin romper el flujo de trabajo
      - name: Upload prediction CSV
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ github.run_id }}
          path: predictions_*.csv
          retention-days: 90
          if-no-files-found: warn
