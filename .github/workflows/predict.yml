name: Daily Prediction Batch

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Prediction date (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""
      competitions:
        description: "Space-separated competition IDs"
        required: true
        default: "sr:competition:17"

  schedule:
    # Run every day at 06:00 UTC
    - cron: "0 6 * * *"

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
      SPORTRADAR_ACCESS_LEVEL: ${{ secrets.SPORTRADAR_ACCESS_LEVEL || 'trial' }}
      ARTIFACTS_DIR: ./artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create artifacts directory
        run: mkdir -p artifacts/models

      # Intento principal de descarga del artifact
      - name: Download latest trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: artifacts/models/
        continue-on-error: true

      - name: Check downloaded models
        id: check_models
        run: |
          if [ -d "artifacts/models" ] && [ "$(ls -A artifacts/models 2>/dev/null)" ]; then
            echo "✅ Models found in artifact"
            echo "has_models=true" >> $GITHUB_OUTPUT
            ls -la artifacts/models/
          else
            echo "⚠️ No models found in artifact"
            echo "has_models=false" >> $GITHUB_OUTPUT
          fi

      # Fallback: intentar descargar el último artifact del workflow de train usando gh
      - name: Fallback - Download latest artifact via gh
        if: steps.check_models.outputs.has_models != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Trying to find the latest trained-models artifact from Train Super-Ensemble..."
          
          # Buscar el último run exitoso del workflow de train
          RUN_ID=$(gh run list --workflow="Train Super-Ensemble" --status=success --limit 1 --json databaseId --jq '.[0].databaseId' || echo "")
          
          if [ -n "$RUN_ID" ]; then
            echo "Found successful train run: $RUN_ID"
            gh run download $RUN_ID --name trained-models --dir artifacts/models/ || true
          else
            echo "No previous successful train run found"
          fi

          if [ -d "artifacts/models" ] && [ "$(ls -A artifacts/models 2>/dev/null)" ]; then
            echo "✅ Models recovered via gh"
            ls -la artifacts/models/
          else
            echo "⚠️ Still no models. Will try with any committed models in the repo."
          fi

      - name: Run inference
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          COMPETITIONS="${{ github.event.inputs.competitions || 'sr:competition:17' }}"

          echo "Running prediction with competitions: $COMPETITIONS"
          python predict.py $DATE_ARG --competitions $COMPETITIONS --log-level INFO

      - name: Upload prediction CSV
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ github.run_id }}
          path: predictions_*.csv
          retention-days: 90
          if-no-files-found: warn
